version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm_buddy_backend_api
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - nginx_default

  redis:
    image: redis:7-alpine
    container_name: pm_buddy_backend_redis
    volumes:
      - redis_data:/data
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm_buddy_backend_worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.worker"]
    restart: always
    networks:
      - default

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm_buddy_backend_scheduler
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.scheduler"]
    restart: always
    networks:
      - default

volumes:
  redis_data:

networks:
  default:
    name: pm_buddy_backend_internal
  nginx_default:
    external: true
